<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉사 보고서 점검 · 교수 현황</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c8262e' stroke-width='3'/%3E%3Cpath d='M10 16l4 4 8-9' fill='none' stroke='%23c8262e' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=1.0.5">
<script type="module" src="admin.js?v=1.0.5"></script>
</head>
<body>
<a class="skip" href="#main" data-s="skip">본문으로 건너뛰기</a>
<div class="wrap wide">
  <header class="masthead">
    <div>
      <h1 data-s="h1">지역사회봉사 최종보고서 점검</h1>
      <p data-s="lede">제출하기 전에 빈칸, 기관 날인, 20시간 증빙을 확인합니다.</p>
    </div>
    <div class="mast-side">
      <div class="langs" role="group" aria-label="언어 · Ngôn ngữ">
        <button type="button" data-lang="ko" lang="ko" aria-pressed="true">한국어</button>
        <button type="button" data-lang="vi" lang="vi" aria-pressed="false">Tiếng Việt</button>
      </div>
      <span class="term" data-s="term">위덕대학교 · 지역사회봉사</span>
    </div>
  </header>
  <nav class="roles" aria-label="입장 구분">
    <a data-href="./" href="./" data-s="roleStudent">학생 점검</a>
    <a data-href="admin.html" href="admin.html" aria-current="page" data-s="roleProf">교수 현황</a>
  </nav>
  <p class="notice prof-only" data-a="koOnly" hidden><span lang="vi">Màn hình giảng viên chỉ có tiếng Hàn.</span> 교수 현황 화면은 한국어로만 제공합니다.</p>
  <main id="main">
  <div class="prof-head">
    <h2>점검 현황</h2>
    <p>학생별 오류 변화, 우수 선별용 환산 점수, 확인 필요 판정. 이 화면의 점수는 학생에게 보이지 않습니다.</p>
  </div>
  <section id="login">
    <form id="login-form" class="sheet formgrid" style="max-width:520px">
      <label for="pw">비밀번호</label>
      <div class="val"><input type="password" id="pw" autocomplete="current-password" required></div>
    </form>
    <p class="err" id="login-err" role="alert"></p>
    <div class="actions"><button form="login-form" type="submit" id="login-btn">현황 열기</button></div>
  </section>

  <section id="dash" hidden>
    <div class="actions" style="margin:0 0 16px;justify-content:space-between">
      <span class="note" id="loaded-at"></span>
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="ghost" id="reload" type="button">새로 불러오기</button>
        <button class="ghost" id="csv-students" type="button">학생별 요약 내려받기</button>
        <button class="ghost" id="csv-checks" type="button">전체 점검 기록 내려받기</button>
      </span>
    </div>
    <dl class="kpis" id="kpis"></dl>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="students">학생별</button>
      <button role="tab" aria-selected="false" data-tab="review">확인 필요 <span id="review-count"></span></button>
      <button role="tab" aria-selected="false" data-tab="types">오류 유형</button>
      <button role="tab" aria-selected="false" data-tab="majors">전공별</button>
      <button role="tab" aria-selected="false" data-tab="signals">참고 신호</button>
    </div>
    <div class="panel" id="panel-students"></div>
    <div class="panel" id="panel-review" hidden></div>
    <div class="panel" id="panel-types" hidden></div>
    <div class="panel" id="panel-majors" hidden></div>
    <div class="panel" id="panel-signals" hidden></div>
  </section>
  </main>
  <footer class="small">점검 기록은 학생 화면의 「기록되는 내용 보기」에 적힌 항목만 서버에 남습니다. 보고서 파일은 서버에 올라오지 않습니다.</footer>
  <p class="ver" id="app-ver"></p>
</div>

<dialog id="detail" aria-labelledby="detail-h">
  <header><h2 id="detail-h"></h2><button class="ghost" id="detail-close" type="button">닫기</button></header>
  <div class="body" id="detail-body"></div>
</dialog>
</body>
</html>
