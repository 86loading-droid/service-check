<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>봉사 보고서 점검 현황</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%231b2333' stroke-width='3'/%3E%3Cpath d='M10 16l4 4 8-9' fill='none' stroke='%231b2333' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css?v=1.0.0">
<script type="module" src="admin.js?v=1.0.0"></script>
</head>
<body>
<div class="wrap wide">
  <header class="masthead">
    <div>
      <h1>점검 현황</h1>
      <p>학생별 오류 변화, 우수 선별용 환산 점수, 확인 필요 판정. 이 화면의 점수는 학생에게 보이지 않습니다.</p>
    </div>
    <span class="term">교수 전용</span>
  </header>

  <section id="login">
    <form id="login-form" class="sheet formgrid" style="max-width:520px">
      <label for="pw">비밀번호</label>
      <div class="val"><input type="password" id="pw" autocomplete="current-password" required></div>
    </form>
    <p class="err" id="login-err" role="alert"></p>
    <div class="actions"><button form="login-form" type="submit" id="login-btn">현황 열기</button></div>
  </section>

  <section id="dash" hidden>
    <div class="actions" style="margin:0 0 16px;justify-content:space-between">
      <span class="note" id="loaded-at"></span>
      <span style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="ghost" id="reload" type="button">새로 불러오기</button>
        <button class="ghost" id="csv-students" type="button">학생별 요약 내려받기</button>
        <button class="ghost" id="csv-checks" type="button">전체 점검 기록 내려받기</button>
      </span>
    </div>
    <dl class="kpis" id="kpis"></dl>

    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="students">학생별</button>
      <button role="tab" aria-selected="false" data-tab="review">확인 필요 <span id="review-count"></span></button>
      <button role="tab" aria-selected="false" data-tab="types">오류 유형</button>
      <button role="tab" aria-selected="false" data-tab="majors">전공별</button>
      <button role="tab" aria-selected="false" data-tab="signals">참고 신호</button>
    </div>
    <div class="panel" id="panel-students"></div>
    <div class="panel" id="panel-review" hidden></div>
    <div class="panel" id="panel-types" hidden></div>
    <div class="panel" id="panel-majors" hidden></div>
    <div class="panel" id="panel-signals" hidden></div>
  </section>
</div>

<dialog id="detail" aria-labelledby="detail-h">
  <header><h2 id="detail-h"></h2><button class="ghost" id="detail-close" type="button">닫기</button></header>
  <div class="body" id="detail-body"></div>
</dialog>
</body>
</html>
